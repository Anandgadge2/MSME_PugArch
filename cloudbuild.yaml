steps:
  # 1. Build Backend Container Image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '$_LOCATION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/backend:$_TAG'
      - '-t'
      - '$_LOCATION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/backend:latest'
      - '-f'
      - 'Dockerfile.backend'
      - '.'
    id: 'build-backend'

  # 2. Build Frontend Container Image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '$_LOCATION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/frontend:$_TAG'
      - '-t'
      - '$_LOCATION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/frontend:latest'
      - '--build-arg'
      - 'NEXT_PUBLIC_API_URL=$_NEXT_PUBLIC_API_URL'
      - '--build-arg'
      - 'NEXT_PUBLIC_APP_URL=$_NEXT_PUBLIC_APP_URL'
      - '-f'
      - 'Dockerfile.frontend'
      - '.'
    id: 'build-frontend'


  # 3. Push Backend Images to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', '$_LOCATION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/backend']
    id: 'push-backend'

  # 4. Push Frontend Images to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', '$_LOCATION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/frontend']
    id: 'push-frontend'

  # 5. Deploy Backend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'msme-backend'
      - '--image=$_LOCATION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/backend:$_TAG'
      - '--region=$_LOCATION'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--cpu=2'
      - '--memory=2Gi'
      - '--set-env-vars=NODE_ENV=production,STORAGE_PROVIDER=gcp,GCS_BUCKET_NAME=jsgsmile1,GCP_PROJECT_ID=jharsuguda-mart,CACHE_DRIVER=redis,REDIS_PREFIX=msme:,SMTP_HOST=smtp.gmail.com,SMTP_PORT=587,SMTP_USER=jsgsmileportal@gmail.com,SMS_ENABLED=true,SMS_PROVIDER=msg91,MSG91_SENDER_ID=JSGSMI,MSG91_COMMON_OTP_TEMPLATE_ID=6a43a4ba7ed932eb330a65c3,APISETU_CLIENT_ID=in.pugarch,APISETU_GST_URL=https://apisetu.gov.in/gstn/v2/taxpayers/{gstin},MERIPEHCHAAN_CLIENT_ID=THD9195825,MERIPEHCHAAN_AUTH_URL=https://digilocker.meripehchaan.gov.in/public/oauth2/1/authorize,MERIPEHCHAAN_TOKEN_URL=https://digilocker.meripehchaan.gov.in/public/oauth2/2/token,MERIPEHCHAAN_USERINFO_URL=https://digilocker.meripehchaan.gov.in/public/oauth2/1/user,MERIPEHCHAAN_JWKS_URL=https://digilocker.meripehchaan.gov.in/public/oauth2/jwks,MERIPEHCHAAN_ISSUER=https://digilocker.meripehchaan.gov.in,PUSHER_APP_ID=2195857,PUSHER_KEY=68be34fe75cc4145142b,PUSHER_CLUSTER=ap2,FRONTEND_URL=https://www.jsgsmile.in,PRODUCTION_URL=https://www.jsgsmile.in,CORS_ALLOWED_ORIGINS=https://www.jsgsmile.in,https://msme-frontend-yvkunmwzya-el.a.run.app,https://msme-pugarch-frontend.vercel.app'
      - '--set-secrets=DATABASE_URL=msme-database-url:latest,DIRECT_URL=msme-direct-url:latest,JWT_SECRET=msme-jwt-secret:latest,JWT_ACCESS_SECRET=msme-jwt-access-secret:latest,JWT_REFRESH_SECRET=msme-jwt-refresh-secret:latest,REDIS_URL=msme-redis-url:latest,GCP_SERVICE_ACCOUNT_JSON=msme-gcp-service-account:latest,SMTP_PASS=msme-smtp-pass:latest,APISETU_API_KEY=msme-apisetu-api-key:latest,MSG91_AUTH_KEY=msme-msg91-auth-key:latest,MERIPEHCHAAN_CLIENT_SECRET=msme-meripehchaan-secret:latest,PUSHER_SECRET=msme-pusher-secret:latest'
    id: 'deploy-backend'


  # 6. Deploy Frontend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'msme-frontend'
      - '--image=$_LOCATION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/frontend:$_TAG'
      - '--region=$_LOCATION'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--cpu=1'
      - '--memory=1Gi'
      - '--set-env-vars=NODE_ENV=production,NEXT_TELEMETRY_DISABLED=1,BACKEND_URL=$_BACKEND_URL,NEXT_PUBLIC_BACKEND_URL=$_BACKEND_URL,NEXT_PUBLIC_APP_URL=https://www.jsgsmile.in,NEXT_PUBLIC_ENABLE_PROCUREMENT_DEMO_DATA=false,NEXT_PUBLIC_PUSHER_KEY=68be34fe75cc4145142b,NEXT_PUBLIC_PUSHER_CLUSTER=ap2'
    id: 'deploy-frontend'




substitutions:
  _LOCATION: 'asia-south1'
  _AR_REPO: 'msme-repo'
  _TAG: 'latest'
  _BACKEND_URL: 'https://msme-backend-yvkunmwzya-el.a.run.app'
  _NEXT_PUBLIC_API_URL: '/proxy'
  _NEXT_PUBLIC_APP_URL: 'https://www.jsgsmile.in'

options:
  logging: CLOUD_LOGGING_ONLY

