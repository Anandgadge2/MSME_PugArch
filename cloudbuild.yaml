steps:
  # 1. Build Backend Container Image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '$_AR_LOCATION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/backend:$SHORT_SHA'
      - '-t'
      - '$_AR_LOCATION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/backend:latest'
      - '-f'
      - 'Dockerfile.backend'
      - '.'
    id: 'build-backend'

  # 2. Build Frontend Container Image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '$_AR_LOCATION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/frontend:$SHORT_SHA'
      - '-t'
      - '$_AR_LOCATION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/frontend:latest'
      - '--build-arg'
      - 'NEXT_PUBLIC_API_URL=$_NEXT_PUBLIC_API_URL'
      - '--build-arg'
      - 'NEXT_PUBLIC_APP_URL=$_NEXT_PUBLIC_APP_URL'
      - '-f'
      - 'Dockerfile.frontend'
      - '.'
    id: 'build-frontend'

  # 3. Push Backend Images to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '$_AR_LOCATION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/backend:$SHORT_SHA'
    id: 'push-backend-sha'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '$_AR_LOCATION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/backend:latest'
    id: 'push-backend-latest'

  # 4. Push Frontend Images to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '$_AR_LOCATION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/frontend:$SHORT_SHA'
    id: 'push-frontend-sha'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '$_AR_LOCATION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/frontend:latest'
    id: 'push-frontend-latest'

  # 5. Deploy Backend to Cloud Run Mumbai
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'msme-backend'
      - '--image=$_AR_LOCATION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/backend:latest'
      - '--region=$_AR_LOCATION'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--cpu=2'
      - '--memory=2Gi'
    id: 'deploy-backend'

  # 6. Deploy Frontend to Cloud Run Singapore
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'jsgsmile-frontend'
      - '--image=$_AR_LOCATION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/frontend:latest'
      - '--region=$_RUN_REGION'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--cpu=1'
      - '--memory=1Gi'
      - '--update-env-vars=NODE_ENV=production,NEXT_TELEMETRY_DISABLED=1,BACKEND_URL=$_BACKEND_URL,NEXT_PUBLIC_BACKEND_URL=$_BACKEND_URL,NEXT_PUBLIC_API_URL=$_NEXT_PUBLIC_API_URL,NEXT_PUBLIC_APP_URL=$_NEXT_PUBLIC_APP_URL,NEXT_PUBLIC_ENABLE_PROCUREMENT_DEMO_DATA=false,NEXT_PUBLIC_PUSHER_KEY=68be34fe75cc4145142b,NEXT_PUBLIC_PUSHER_CLUSTER=ap2'
    id: 'deploy-frontend'

# Build substitutions
substitutions:
  # Existing Artifact Registry location (verify before first build)
  _AR_LOCATION: 'asia-south1'

  # New Cloud Run deployment location
  _RUN_REGION: 'asia-southeast1'

  # Existing Artifact Registry repository
  _AR_REPO: 'msme-repo'

  # Existing Mumbai backend
  _BACKEND_URL: 'https://msme-backend-yvkunmwzya-el.a.run.app'

  # Frontend configuration
  _NEXT_PUBLIC_API_URL: '/proxy'
  _NEXT_PUBLIC_APP_URL: 'https://www.jsgsmile.in'

options:
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: 'ALLOW_LOOSE'
