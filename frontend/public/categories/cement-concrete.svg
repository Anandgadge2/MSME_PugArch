<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <defs>
    <linearGradient id="cc_cement" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f1f5f9"/><stop offset="100%" stop-color="#94a3b8"/></linearGradient>
    <linearGradient id="cc_block" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#cbd5e1"/><stop offset="100%" stop-color="#64748b"/></linearGradient>
    <linearGradient id="cc_wood" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#d97706"/><stop offset="100%" stop-color="#92400e"/></linearGradient>
    <filter id="cc_shadow" x="-10%" y="-10%" width="130%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.18"/></filter>
  </defs>
  <!-- Concrete Hollow Blocks -->
  <g filter="url(#cc_shadow)">
    <rect x="22" y="70" width="46" height="28" rx="3" fill="url(#cc_block)" stroke="#475569" stroke-width="1.5"/>
    <rect x="28" y="76" width="14" height="16" rx="2" fill="#334155"/>
    <rect x="48" y="76" width="14" height="16" rx="2" fill="#334155"/>
  </g>
  <!-- Heavy Portland Cement Bag -->
  <g filter="url(#cc_shadow)">
    <path d="M68 40 L112 40 L116 88 L64 88 Z" fill="url(#cc_cement)" stroke="#475569" stroke-width="1.5"/>
    <rect x="72" y="52" width="36" height="18" rx="2" fill="#059669"/>
    <text x="90" y="64" font-family="sans-serif" font-size="7.5" font-weight="900" fill="#ffffff" text-anchor="middle">CEMENT</text>
    <path d="M68 40 L112 40" stroke="#059669" stroke-width="4" stroke-dasharray="3 2"/>
    <path d="M64 88 L116 88" stroke="#059669" stroke-width="3" stroke-dasharray="3 2"/>
  </g>
  <!-- Masonry Bricklayer Trowel -->
  <g filter="url(#cc_shadow)" transform="rotate(-15 45 45)">
    <polygon points="40,25 62,45 36,52" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
    <path d="M42 38 L32 30 L22 30" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <rect x="12" y="27" width="12" height="6" rx="2" fill="url(#cc_wood)"/>
  </g>
</svg>
