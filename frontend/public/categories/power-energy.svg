<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <defs>
    <linearGradient id="pe_solar" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1e40af"/><stop offset="100%" stop-color="#0284c7"/></linearGradient>
    <linearGradient id="pe_sun" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fde047"/><stop offset="100%" stop-color="#ea580c"/></linearGradient>
    <filter id="pe_shadow" x="-10%" y="-10%" width="130%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.18"/></filter>
  </defs>
  <!-- Solar PV Panel -->
  <g filter="url(#pe_shadow)">
    <!-- Stand -->
    <polygon points="45,95 75,95 65,75 55,75" fill="#475569"/>
    <!-- Angled Panel Frame -->
    <polygon points="25,75 95,75 80,42 35,42" fill="url(#pe_solar)" stroke="#1e293b" stroke-width="1.5"/>
    <!-- Solar Cells Grid -->
    <line x1="43" y1="42" x2="38" y2="75" stroke="#93c5fd" stroke-width="1"/>
    <line x1="55" y1="42" x2="55" y2="75" stroke="#93c5fd" stroke-width="1"/>
    <line x1="68" y1="42" x2="72" y2="75" stroke="#93c5fd" stroke-width="1"/>
    <line x1="30" y1="58" x2="88" y2="58" stroke="#93c5fd" stroke-width="1"/>
  </g>
  <!-- Wind Turbine Generator -->
  <g filter="url(#pe_shadow)" transform="translate(95, 20)">
    <!-- Tower -->
    <path d="M12 40 L9 75 L15 75 Z" fill="#94a3b8" stroke="#475569" stroke-width="1"/>
    <!-- Nacelle Hub -->
    <circle cx="12" cy="40" r="5" fill="#1e293b"/>
    <!-- 3 Rotor Blades -->
    <path d="M12 40 L12 10 L14 40 Z" fill="#f8fafc" stroke="#475569" stroke-width="0.75"/>
    <path d="M12 40 L-14 55 L12 42 Z" fill="#f8fafc" stroke="#475569" stroke-width="0.75"/>
    <path d="M12 40 L38 55 L12 42 Z" fill="#f8fafc" stroke="#475569" stroke-width="0.75"/>
  </g>
  <!-- Sun / Green Energy Glow -->
  <g transform="translate(20, 20)">
    <circle cx="14" cy="14" r="10" fill="url(#pe_sun)"/>
    <polygon points="14,0 12,5 16,5" fill="#f59e0b"/>
    <polygon points="0,14 5,12 5,16" fill="#f59e0b"/>
  </g>
</svg>
