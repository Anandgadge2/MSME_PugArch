<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <defs>
    <linearGradient id="tc_blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#1d4ed8"/></linearGradient>
    <linearGradient id="tc_dish" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#cbd5e1"/></linearGradient>
    <filter id="tc_shadow" x="-10%" y="-10%" width="130%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.18"/></filter>
  </defs>
  <!-- Telecom Lattice Tower Pylon Structure -->
  <g filter="url(#tc_shadow)">
    <!-- Tower Main Legs -->
    <path d="M48 20 L28 96 M48 20 L68 96" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
    <!-- Cross Braces -->
    <line x1="43" y1="40" x2="53" y2="40" stroke="#64748b" stroke-width="2"/>
    <line x1="39" y1="58" x2="57" y2="58" stroke="#64748b" stroke-width="2"/>
    <line x1="33" y1="78" x2="63" y2="78" stroke="#64748b" stroke-width="2"/>
    <line x1="28" y1="96" x2="68" y2="96" stroke="#475569" stroke-width="3"/>
    <line x1="43" y1="40" x2="57" y2="58" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="53" y1="40" x2="39" y2="58" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="39" y1="58" x2="63" y2="78" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="57" y1="58" x2="33" y2="78" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Top Beacon -->
    <circle cx="48" cy="18" r="4" fill="#ef4444"/>
  </g>
  <!-- Wireless Signal Waves from Tower -->
  <g opacity="0.8">
    <path d="M40 12 A 12 12 0 0 1 56 12" fill="none" stroke="#0284c7" stroke-width="2" stroke-linecap="round"/>
    <path d="M34 6 A 20 20 0 0 1 62 6" fill="none" stroke="#0284c7" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- Microwave Parabolic Satellite Dish Antenna -->
  <g filter="url(#tc_shadow)" transform="translate(85, 45)">
    <!-- Dish bowl -->
    <path d="M0 0 C18 6, 26 28, 14 42 C2 56, -14 44, -10 32" fill="url(#tc_dish)" stroke="#475569" stroke-width="1.5"/>
    <!-- Feed horn & arm -->
    <line x1="2" y1="21" x2="26" y2="12" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <circle cx="26" cy="12" r="3" fill="#ef4444"/>
    <!-- Mount stand -->
    <path d="M-6 26 L-18 45 L0 45" fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
