<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <defs>
    <linearGradient id="me_caliper" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#94a3b8"/></linearGradient>
    <linearGradient id="me_gear" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#1d4ed8"/></linearGradient>
    <filter id="me_shadow" x="-10%" y="-10%" width="130%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.18"/></filter>
  </defs>
  <!-- Large Precision Gear -->
  <g filter="url(#me_shadow)" transform="translate(50, 68)">
    <circle cx="0" cy="0" r="32" fill="url(#me_gear)" stroke="#1e3a8a" stroke-width="2"/>
    <circle cx="0" cy="0" r="14" fill="#f8fafc" stroke="#1e3a8a" stroke-width="2"/>
    <circle cx="0" cy="0" r="6" fill="#1e293b"/>
    <!-- Gear cutouts -->
    <circle cx="0" cy="-20" r="4" fill="#ffffff" opacity="0.8"/>
    <circle cx="20" cy="0" r="4" fill="#ffffff" opacity="0.8"/>
    <circle cx="0" cy="20" r="4" fill="#ffffff" opacity="0.8"/>
    <circle cx="-20" cy="0" r="4" fill="#ffffff" opacity="0.8"/>
  </g>
  <!-- Digital / Vernier Caliper Tool measuring component -->
  <g filter="url(#me_shadow)">
    <!-- Caliper Main Beam -->
    <rect x="25" y="24" width="95" height="10" rx="2" fill="url(#me_caliper)" stroke="#475569" stroke-width="1.5"/>
    <line x1="45" y1="24" x2="45" y2="30" stroke="#475569" stroke-width="1"/>
    <line x1="55" y1="24" x2="55" y2="30" stroke="#475569" stroke-width="1"/>
    <line x1="65" y1="24" x2="65" y2="30" stroke="#475569" stroke-width="1"/>
    <line x1="75" y1="24" x2="75" y2="30" stroke="#475569" stroke-width="1"/>
    <line x1="85" y1="24" x2="85" y2="30" stroke="#475569" stroke-width="1"/>
    <line x1="95" y1="24" x2="95" y2="30" stroke="#475569" stroke-width="1"/>
    <!-- Fixed Jaw -->
    <polygon points="25,24 25,60 33,60 33,34" fill="url(#me_caliper)" stroke="#475569" stroke-width="1.5"/>
    <!-- Sliding Jaw & Digital LCD Display -->
    <g transform="translate(48, 0)">
      <rect x="20" y="20" width="26" height="18" rx="2" fill="#0f172a"/>
      <rect x="23" y="23" width="20" height="10" fill="#a7f3d0"/>
      <text x="33" y="31" font-family="monospace" font-size="7" font-weight="900" fill="#065f46" text-anchor="middle">24.50</text>
      <polygon points="20,24 20,60 27,60 27,34" fill="url(#me_caliper)" stroke="#475569" stroke-width="1.5"/>
    </g>
  </g>
</svg>
