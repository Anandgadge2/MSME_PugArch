<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <defs>
    <linearGradient id="ec_bp" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1d4ed8"/><stop offset="100%" stop-color="#1e3a8a"/></linearGradient>
    <linearGradient id="ec_gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fef08a"/><stop offset="100%" stop-color="#ca8a04"/></linearGradient>
    <filter id="ec_shadow" x="-10%" y="-10%" width="130%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.18"/></filter>
  </defs>
  <!-- Architectural / Engineering Blueprint Roll -->
  <g filter="url(#ec_shadow)">
    <rect x="22" y="36" width="76" height="58" rx="3" fill="url(#ec_bp)" stroke="#60a5fa" stroke-width="1.5"/>
    <!-- Blueprint grid and schematic drawing -->
    <line x1="28" y1="48" x2="92" y2="48" stroke="#93c5fd" stroke-width="0.8" stroke-dasharray="2 2"/>
    <line x1="28" y1="62" x2="92" y2="62" stroke="#93c5fd" stroke-width="0.8" stroke-dasharray="2 2"/>
    <line x1="28" y1="76" x2="92" y2="76" stroke="#93c5fd" stroke-width="0.8" stroke-dasharray="2 2"/>
    <line x1="45" y1="40" x2="45" y2="90" stroke="#93c5fd" stroke-width="0.8" stroke-dasharray="2 2"/>
    <line x1="75" y1="40" x2="75" y2="90" stroke="#93c5fd" stroke-width="0.8" stroke-dasharray="2 2"/>
    <!-- CAD Building layout -->
    <polygon points="36,80 36,54 58,42 78,54 78,80" fill="none" stroke="#ffffff" stroke-width="2"/>
    <circle cx="57" cy="62" r="8" fill="none" stroke="#67e8f9" stroke-width="1.5"/>
  </g>
  <!-- Brass Drafting Compass / Caliper -->
  <g filter="url(#ec_shadow)" transform="translate(82, 30)">
    <!-- Top hinge -->
    <circle cx="20" cy="8" r="6" fill="url(#ec_gold)" stroke="#854d0e" stroke-width="1.5"/>
    <!-- Leg 1 -->
    <line x1="20" y1="12" x2="4" y2="65" stroke="url(#ec_gold)" stroke-width="4" stroke-linecap="round"/>
    <polygon points="4,65 1,72 6,70" fill="#475569"/>
    <!-- Leg 2 -->
    <line x1="20" y1="12" x2="36" y2="65" stroke="url(#ec_gold)" stroke-width="4" stroke-linecap="round"/>
    <polygon points="36,65 39,72 34,70" fill="#475569"/>
    <!-- Center adjustment arc -->
    <path d="M10 38 A 18 18 0 0 0 30 38" fill="none" stroke="#ca8a04" stroke-width="2"/>
  </g>
</svg>
