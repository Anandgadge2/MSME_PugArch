<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <defs>
    <linearGradient id="rc_store" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#4f46e5"/><stop offset="100%" stop-color="#3730a3"/></linearGradient>
    <linearGradient id="rc_cart" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#d97706"/></linearGradient>
    <filter id="rc_shadow" x="-10%" y="-10%" width="130%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.18"/></filter>
  </defs>
  <!-- Commercial Storefront Building & Awning -->
  <g filter="url(#rc_shadow)">
    <!-- Storefront Structure -->
    <rect x="25" y="44" width="60" height="52" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="32" y="60" width="22" height="36" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
    <rect x="58" y="68" width="20" height="28" rx="2" fill="#334155"/>
    <!-- Store Awning with Blue/White stripes -->
    <path d="M20 44 L90 44 L85 30 L25 30 Z" fill="url(#rc_store)"/>
    <polygon points="25,30 35,30 30,44 20,44" fill="#ffffff" opacity="0.3"/>
    <polygon points="45,30 55,30 50,44 40,44" fill="#ffffff" opacity="0.3"/>
    <polygon points="65,30 75,30 70,44 60,44" fill="#ffffff" opacity="0.3"/>
  </g>
  <!-- Modern Commercial Shopping Cart / POS Unit -->
  <g filter="url(#rc_shadow)" transform="translate(75, 48)">
    <path d="M5 8 L14 8 L22 36 L48 36 L54 16 L17 16" fill="none" stroke="url(#rc_cart)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Cart Grid Wire -->
    <line x1="24" y1="26" x2="50" y2="26" stroke="#ca8a04" stroke-width="1.5"/>
    <line x1="32" y1="16" x2="28" y2="36" stroke="#ca8a04" stroke-width="1.5"/>
    <line x1="42" y1="16" x2="38" y2="36" stroke="#ca8a04" stroke-width="1.5"/>
    <!-- Cart Wheels -->
    <circle cx="25" cy="44" r="4.5" fill="#1e293b"/>
    <circle cx="45" cy="44" r="4.5" fill="#1e293b"/>
  </g>
</svg>
