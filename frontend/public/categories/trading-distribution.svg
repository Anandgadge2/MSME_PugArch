<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <defs>
    <linearGradient id="td_wood" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fde68a"/><stop offset="100%" stop-color="#d97706"/></linearGradient>
    <linearGradient id="td_box" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fbbf24"/><stop offset="100%" stop-color="#b45309"/></linearGradient>
    <linearGradient id="td_blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0284c7"/><stop offset="100%" stop-color="#0369a1"/></linearGradient>
    <filter id="td_shadow" x="-10%" y="-10%" width="130%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.18"/></filter>
  </defs>
  <!-- Wooden Warehouse Pallet Base -->
  <g filter="url(#td_shadow)">
    <rect x="25" y="90" width="90" height="8" rx="2" fill="url(#td_wood)" stroke="#92400e" stroke-width="1"/>
    <rect x="30" y="98" width="16" height="8" rx="1" fill="#78350f"/>
    <rect x="62" y="98" width="16" height="8" rx="1" fill="#78350f"/>
    <rect x="94" y="98" width="16" height="8" rx="1" fill="#78350f"/>
  </g>
  <!-- Palletized Cartons Stack -->
  <g filter="url(#td_shadow)">
    <!-- Box 1 Left -->
    <rect x="28" y="52" width="40" height="38" rx="3" fill="url(#td_box)" stroke="#78350f" stroke-width="1.5"/>
    <line x1="48" y1="52" x2="48" y2="90" stroke="#78350f" stroke-width="1"/>
    <rect x="34" y="62" width="14" height="8" rx="1" fill="#ffffff" opacity="0.9"/>
    <!-- Box 2 Right -->
    <rect x="72" y="44" width="42" height="46" rx="3" fill="url(#td_box)" stroke="#78350f" stroke-width="1.5"/>
    <line x1="93" y1="44" x2="93" y2="90" stroke="#78350f" stroke-width="1"/>
    <rect x="78" y="54" width="14" height="8" rx="1" fill="#ffffff" opacity="0.9"/>
  </g>
  <!-- Handheld Barcode Scanner Gun -->
  <g filter="url(#td_shadow)" transform="rotate(-20 85 30)">
    <rect x="70" y="20" width="30" height="14" rx="3" fill="url(#td_blue)" stroke="#075985" stroke-width="1"/>
    <rect x="75" y="34" width="10" height="20" rx="3" fill="#1e293b"/>
    <polygon points="100,22 106,27 100,32" fill="#ef4444"/>
    <!-- Red laser scan line -->
    <line x1="106" y1="27" x2="128" y2="27" stroke="#ef4444" stroke-width="2" stroke-dasharray="3 2"/>
  </g>
</svg>
