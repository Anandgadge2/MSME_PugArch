<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <defs>
    <linearGradient id="fh_steel" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f8fafc"/><stop offset="50%" stop-color="#cbd5e1"/><stop offset="100%" stop-color="#64748b"/></linearGradient>
    <linearGradient id="fh_gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fde047"/><stop offset="100%" stop-color="#ca8a04"/></linearGradient>
    <filter id="fh_shadow" x="-10%" y="-10%" width="130%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.18"/></filter>
  </defs>
  <!-- Large High Tensile Hex Bolt -->
  <g filter="url(#fh_shadow)" transform="rotate(-35 60 70)">
    <!-- Hex Head -->
    <polygon points="40,25 70,25 80,40 65,55 35,55 25,40" fill="url(#fh_steel)" stroke="#334155" stroke-width="1.5"/>
    <circle cx="52.5" cy="40" r="10" fill="#cbd5e1" stroke="#64748b" stroke-width="1"/>
    <!-- Threaded Shaft -->
    <rect x="44" y="55" width="17" height="48" fill="url(#fh_steel)" stroke="#334155" stroke-width="1.5"/>
    <!-- Thread ridges -->
    <line x1="44" y1="62" x2="61" y2="62" stroke="#475569" stroke-width="1.5"/>
    <line x1="44" y1="70" x2="61" y2="70" stroke="#475569" stroke-width="1.5"/>
    <line x1="44" y1="78" x2="61" y2="78" stroke="#475569" stroke-width="1.5"/>
    <line x1="44" y1="86" x2="61" y2="86" stroke="#475569" stroke-width="1.5"/>
    <line x1="44" y1="94" x2="61" y2="94" stroke="#475569" stroke-width="1.5"/>
  </g>
  <!-- Heavy Hex Nut -->
  <g filter="url(#fh_shadow)" transform="translate(94, 46)">
    <polygon points="12,0 28,0 36,15 28,30 12,30 4,15" fill="url(#fh_gold)" stroke="#854d0e" stroke-width="1.5"/>
    <circle cx="20" cy="15" r="7" fill="#ffffff" stroke="#854d0e" stroke-width="1.5"/>
    <circle cx="20" cy="15" r="4" fill="#854d0e"/>
  </g>
  <!-- Lock Washer & Screw -->
  <g filter="url(#fh_shadow)" transform="translate(88, 85)">
    <circle cx="16" cy="16" r="14" fill="url(#fh_steel)" stroke="#334155" stroke-width="1.5"/>
    <circle cx="16" cy="16" r="7" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  </g>
</svg>
