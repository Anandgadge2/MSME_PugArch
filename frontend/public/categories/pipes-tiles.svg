<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <defs>
    <linearGradient id="pt_pvc" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#0284c7"/></linearGradient>
    <linearGradient id="pt_tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#cbd5e1"/></linearGradient>
    <linearGradient id="pt_brass" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fef08a"/><stop offset="100%" stop-color="#ca8a04"/></linearGradient>
    <filter id="pt_shadow" x="-10%" y="-10%" width="130%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.18"/></filter>
  </defs>
  <!-- Glazed Ceramic Floor Tile Pattern -->
  <g filter="url(#pt_shadow)">
    <rect x="22" y="55" width="45" height="45" rx="4" fill="url(#pt_tile)" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="26" y="59" width="17" height="17" rx="2" fill="#e0f2fe"/>
    <rect x="46" y="59" width="17" height="17" rx="2" fill="#0284c7" opacity="0.8"/>
    <rect x="26" y="79" width="17" height="17" rx="2" fill="#0284c7" opacity="0.8"/>
    <rect x="46" y="79" width="17" height="17" rx="2" fill="#e0f2fe"/>
  </g>
  <!-- PVC Piping with Elbow Junction -->
  <g filter="url(#pt_shadow)">
    <!-- Horizontal Pipe -->
    <path d="M55 42 L108 42 A 12 12 0 0 1 120 54 L120 95" fill="none" stroke="url(#pt_pvc)" stroke-width="14" stroke-linecap="round"/>
    <!-- Flange / Coupling Rings -->
    <rect x="52" y="32" width="6" height="20" rx="2" fill="#0369a1"/>
    <rect x="80" y="32" width="6" height="20" rx="2" fill="#0369a1"/>
    <rect x="110" y="85" width="20" height="6" rx="2" fill="#0369a1"/>
  </g>
  <!-- Brass Water Tap / Faucet Wheel -->
  <g filter="url(#pt_shadow)">
    <circle cx="83" cy="24" r="10" fill="url(#pt_brass)" stroke="#a16207" stroke-width="1.5"/>
    <line x1="73" y1="24" x2="93" y2="24" stroke="#78350f" stroke-width="2"/>
    <line x1="83" y1="14" x2="83" y2="34" stroke="#78350f" stroke-width="2"/>
    <circle cx="83" cy="24" r="3.5" fill="#78350f"/>
  </g>
</svg>
