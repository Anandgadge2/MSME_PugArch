<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <defs>
    <linearGradient id="wc_inv" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ef4444"/><stop offset="100%" stop-color="#b91c1c"/></linearGradient>
    <linearGradient id="wc_torch" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#b45309"/></linearGradient>
    <filter id="wc_shadow" x="-10%" y="-10%" width="130%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.18"/></filter>
  </defs>
  <!-- Inverter ARC / MMA Welding Machine Box -->
  <g filter="url(#wc_shadow)">
    <!-- Main Box -->
    <rect x="25" y="44" width="56" height="48" rx="5" fill="url(#wc_inv)" stroke="#991b1b" stroke-width="1.5"/>
    <!-- Top Carry Handle -->
    <path d="M40 44 L40 34 L66 34 L66 44" fill="none" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
    <!-- Digital Amp Meter Display -->
    <rect x="32" y="52" width="22" height="12" rx="2" fill="#0f172a"/>
    <text x="43" y="61" font-family="monospace" font-size="7" font-weight="900" fill="#22c55e" text-anchor="middle">200A</text>
    <!-- Adjustment Knob -->
    <circle cx="68" cy="58" r="5" fill="#334155" stroke="#94a3b8" stroke-width="1"/>
    <!-- Terminal Outlets (+ / -) -->
    <circle cx="38" cy="78" r="5" fill="#ef4444" stroke="#7f1d1d" stroke-width="1"/>
    <circle cx="68" cy="78" r="5" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  </g>
  <!-- Heavy Duty Electrode Holder Clamp with Rod -->
  <g filter="url(#wc_shadow)" transform="rotate(30 95 65)">
    <!-- Clamp Jaw -->
    <rect x="80" y="60" width="28" height="12" rx="3" fill="#1e293b"/>
    <polygon points="108,62 118,60 118,72 108,70" fill="#f59e0b"/>
    <!-- Welding Electrode Rod -->
    <line x1="118" y1="66" x2="142" y2="66" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <!-- Handle -->
    <rect x="58" y="62" width="22" height="8" rx="2" fill="url(#wc_torch)"/>
  </g>
</svg>
