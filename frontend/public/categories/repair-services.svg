<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <defs>
    <linearGradient id="rs_box" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0284c7"/><stop offset="100%" stop-color="#0369a1"/></linearGradient>
    <linearGradient id="rs_gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#d97706"/></linearGradient>
    <filter id="rs_shadow" x="-10%" y="-10%" width="130%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.18"/></filter>
  </defs>
  <!-- Heavy Duty Metal Technician Toolbox -->
  <g filter="url(#rs_shadow)">
    <!-- Toolbox Bottom Box -->
    <rect x="25" y="58" width="65" height="38" rx="4" fill="url(#rs_box)" stroke="#075985" stroke-width="1.5"/>
    <rect x="25" y="70" width="65" height="4" fill="#075985"/>
    <!-- Metal latches -->
    <rect x="38" y="66" width="8" height="10" rx="1.5" fill="#f8fafc" stroke="#475569" stroke-width="1"/>
    <rect x="68" y="66" width="8" height="10" rx="1.5" fill="#f8fafc" stroke="#475569" stroke-width="1"/>
    <!-- Hinged Lid -->
    <path d="M25 58 L32 46 L82 46 L90 58 Z" fill="#0284c7" stroke="#075985" stroke-width="1.5"/>
    <!-- Carry Handle on Top -->
    <rect x="46" y="38" width="22" height="8" rx="2" fill="#1e293b"/>
  </g>
  <!-- Service Wrench / Gear Certified Badge -->
  <g filter="url(#rs_shadow)" transform="translate(94, 60)">
    <circle cx="0" cy="0" r="24" fill="url(#rs_gold)" stroke="#b45309" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="19" fill="#ffffff"/>
    <!-- Verified Service Tick / Checkmark with Wrench -->
    <path d="M-8 0 L-2 7 L10 -5" fill="none" stroke="#16a34a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
