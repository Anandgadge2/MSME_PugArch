<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <defs>
    <linearGradient id="ch_blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0284c7"/><stop offset="100%" stop-color="#0369a1"/></linearGradient>
    <linearGradient id="ch_box" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#d97706"/></linearGradient>
    <linearGradient id="ch_metal" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#94a3b8"/></linearGradient>
    <filter id="ch_shadow" x="-10%" y="-10%" width="130%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.18"/></filter>
  </defs>
  <!-- Motorized Industrial Roller Conveyor -->
  <g filter="url(#ch_shadow)">
    <!-- Side Rails -->
    <rect x="20" y="65" width="100" height="10" rx="3" fill="url(#ch_blue)" stroke="#075985" stroke-width="1.5"/>
    <!-- Support Legs -->
    <rect x="30" y="75" width="6" height="22" rx="1" fill="#334155"/>
    <rect x="104" y="75" width="6" height="22" rx="1" fill="#334155"/>
    <line x1="30" y1="92" x2="110" y2="92" stroke="#475569" stroke-width="2"/>
    <!-- Rollers along conveyor -->
    <circle cx="28" cy="70" r="5" fill="url(#ch_metal)" stroke="#475569" stroke-width="1"/>
    <circle cx="44" cy="70" r="5" fill="url(#ch_metal)" stroke="#475569" stroke-width="1"/>
    <circle cx="60" cy="70" r="5" fill="url(#ch_metal)" stroke="#475569" stroke-width="1"/>
    <circle cx="76" cy="70" r="5" fill="url(#ch_metal)" stroke="#475569" stroke-width="1"/>
    <circle cx="92" cy="70" r="5" fill="url(#ch_metal)" stroke="#475569" stroke-width="1"/>
    <circle cx="108" cy="70" r="5" fill="url(#ch_metal)" stroke="#475569" stroke-width="1"/>
  </g>
  <!-- Industrial Parcels / Carton moving along conveyor -->
  <g filter="url(#ch_shadow)">
    <rect x="38" y="38" width="28" height="27" rx="2" fill="url(#ch_box)" stroke="#b45309" stroke-width="1"/>
    <line x1="52" y1="38" x2="52" y2="65" stroke="#92400e" stroke-width="1"/>
    <rect x="74" y="44" width="24" height="21" rx="2" fill="url(#ch_box)" stroke="#b45309" stroke-width="1"/>
    <line x1="86" y1="44" x2="86" y2="65" stroke="#92400e" stroke-width="1"/>
  </g>
  <!-- Motion Direction Arrow -->
  <g transform="translate(102, 28)">
    <line x1="0" y1="6" x2="16" y2="6" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>
    <polyline points="10,0 16,6 10,12" fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
