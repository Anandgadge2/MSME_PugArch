<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <defs>
    <linearGradient id="mv_rack" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#4338ca"/><stop offset="100%" stop-color="#312e81"/></linearGradient>
    <linearGradient id="mv_gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fde047"/><stop offset="100%" stop-color="#ca8a04"/></linearGradient>
    <filter id="mv_shadow" x="-10%" y="-10%" width="130%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.18"/></filter>
  </defs>
  <!-- Multi-tier Warehouse Matrix / Category Hub -->
  <g filter="url(#mv_shadow)">
    <!-- 4 Category Tile Grid -->
    <!-- Tile 1: Industrial Gear -->
    <rect x="25" y="28" width="40" height="38" rx="5" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <circle cx="45" cy="47" r="10" fill="#0284c7"/>
    <circle cx="45" cy="47" r="4" fill="#ffffff"/>

    <!-- Tile 2: Chemical Flask -->
    <rect x="75" y="28" width="40" height="38" rx="5" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <polygon points="95,36 91,48 99,48" fill="#16a34a"/>
    <rect x="94" y="34" width="2" height="4" fill="#16a34a"/>

    <!-- Tile 3: Electrical Spark -->
    <rect x="25" y="74" width="40" height="38" rx="5" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <polygon points="46,80 40,92 46,92 44,102 52,90 47,90" fill="#d97706"/>

    <!-- Tile 4: Package Box -->
    <rect x="75" y="74" width="40" height="38" rx="5" fill="#fae8ff" stroke="#a855f7" stroke-width="1.5"/>
    <rect x="85" y="84" width="20" height="18" rx="2" fill="#a855f7"/>
    <line x1="95" y1="84" x2="95" y2="102" stroke="#ffffff" stroke-width="1.5"/>
  </g>
</svg>
