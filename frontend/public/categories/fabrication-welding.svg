<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <defs>
    <linearGradient id="fw_mask" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#334155"/><stop offset="100%" stop-color="#0f172a"/></linearGradient>
    <linearGradient id="fw_glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#065f46"/><stop offset="100%" stop-color="#047857"/></linearGradient>
    <linearGradient id="fw_torch" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f97316"/><stop offset="100%" stop-color="#c2410c"/></linearGradient>
    <filter id="fw_shadow" x="-10%" y="-10%" width="130%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.18"/></filter>
  </defs>
  <!-- Auto-Darkening Welding Helmet -->
  <g filter="url(#fw_shadow)">
    <path d="M25 45 C25 25, 45 20, 62 20 C78 20, 80 32, 80 48 C80 68, 75 88, 55 92 C40 95, 25 80, 25 45 Z" fill="url(#fw_mask)" stroke="#475569" stroke-width="1.5"/>
    <!-- Viewing Lens Filter -->
    <rect x="42" y="38" width="28" height="16" rx="3" fill="url(#fw_glass)" stroke="#10b981" stroke-width="1.5"/>
    <line x1="46" y1="46" x2="66" y2="46" stroke="#34d399" stroke-width="1" opacity="0.6"/>
  </g>
  <!-- MIG / TIG Welding Torch Handle & Nozzle -->
  <g filter="url(#fw_shadow)" transform="rotate(-35 95 65)">
    <!-- Torch Neck -->
    <path d="M75 75 L105 75 L115 65" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
    <!-- Torch Handle -->
    <rect x="55" y="70" width="30" height="10" rx="3" fill="url(#fw_torch)" stroke="#9a3412" stroke-width="1"/>
    <!-- Copper Contact Tip Nozzle -->
    <polygon points="115,62 124,56 126,60 117,66" fill="#f59e0b" stroke="#b45309" stroke-width="1"/>
  </g>
  <!-- Bright Welding Electric Arc Sparks -->
  <g transform="translate(92, 44)">
    <circle cx="0" cy="0" r="4" fill="#ffffff"/>
    <circle cx="0" cy="0" r="7" fill="#38bdf8" opacity="0.5"/>
    <!-- Sparks -->
    <line x1="0" y1="0" x2="8" y2="-10" stroke="#facc15" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="12" y2="4" stroke="#facc15" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="6" y2="12" stroke="#facc15" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-8" y2="-8" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-4" y2="9" stroke="#38bdf8" stroke-width="1" stroke-linecap="round"/>
  </g>
  <!-- Welded Steel Plates -->
  <g filter="url(#fw_shadow)">
    <rect x="75" y="82" width="45" height="12" rx="2" fill="#475569" stroke="#334155" stroke-width="1"/>
    <!-- Weld Bead pattern -->
    <path d="M78 82 Q81 78, 84 82 Q87 78, 90 82 Q93 78, 96 82 Q99 78, 102 82 Q105 78, 108 82 Q111 78, 114 82" fill="none" stroke="#e2e8f0" stroke-width="2"/>
  </g>
</svg>
