<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <defs>
    <linearGradient id="fm_green" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#84cc16"/><stop offset="100%" stop-color="#65a30d"/></linearGradient>
    <linearGradient id="fm_bot" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#0284c7"/></linearGradient>
    <linearGradient id="fm_box" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fb923c"/><stop offset="100%" stop-color="#ea580c"/></linearGradient>
    <filter id="fm_shadow" x="-10%" y="-10%" width="130%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.18"/></filter>
  </defs>
  <!-- FMCG Detergent / Cleanser Bottle with Trigger Spray -->
  <g filter="url(#fm_shadow)">
    <!-- Bottle body -->
    <path d="M30 52 C30 46, 38 46, 42 40 L42 34 L48 34 L48 40 C52 46, 60 46, 60 52 L62 94 A 4 4 0 0 1 58 98 L32 98 A 4 4 0 0 1 28 94 Z" fill="url(#fm_bot)" stroke="#0369a1" stroke-width="1.5"/>
    <rect x="34" y="58" width="22" height="24" rx="2" fill="#ffffff" opacity="0.85"/>
    <circle cx="45" cy="70" r="6" fill="#0284c7"/>
    <!-- Trigger Spray Head -->
    <rect x="40" y="26" width="10" height="8" fill="#1e293b"/>
    <path d="M40 28 L28 28 L28 32 L36 34" fill="#0ea5e9"/>
    <path d="M50 28 L64 32 L60 36 L50 34" fill="#0ea5e9"/>
  </g>
  <!-- FMCG Packaged Goods Box & Soap Dispenser -->
  <g filter="url(#fm_shadow)">
    <!-- Packaged goods carton -->
    <rect x="68" y="48" width="45" height="50" rx="4" fill="url(#fm_box)" stroke="#c2410c" stroke-width="1.5"/>
    <rect x="74" y="58" width="33" height="14" rx="2" fill="#ffffff" opacity="0.9"/>
    <text x="90.5" y="68" font-family="sans-serif" font-size="7.5" font-weight="900" fill="#ea580c" text-anchor="middle">UTILITY</text>
    <!-- Fresh Eco Leaf -->
    <path d="M90 34 C80 34, 76 44, 90 46 C104 44, 100 34, 90 34 Z" fill="url(#fm_green)"/>
  </g>
</svg>
