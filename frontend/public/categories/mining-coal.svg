<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <defs>
    <linearGradient id="mc_cart" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#475569"/><stop offset="100%" stop-color="#1e293b"/></linearGradient>
    <linearGradient id="mc_gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fde047"/><stop offset="100%" stop-color="#ca8a04"/></linearGradient>
    <filter id="mc_shadow" x="-10%" y="-10%" width="130%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.18"/></filter>
  </defs>
  <!-- Heavy Mining Cart Filled with Coal Nuggets -->
  <g filter="url(#mc_shadow)">
    <!-- Black Coal chunks mound -->
    <path d="M36 50 Q48 34, 62 42 Q76 30, 88 44 Q96 40, 102 52 Z" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <circle cx="52" cy="42" r="5" fill="#1e293b"/>
    <circle cx="74" cy="38" r="6" fill="#1e293b"/>
    <circle cx="90" cy="45" r="5" fill="#1e293b"/>
    <!-- Iron Ore Cart Tub -->
    <polygon points="30,50 108,50 98,82 40,82" fill="url(#mc_cart)" stroke="#0f172a" stroke-width="2"/>
    <line x1="45" y1="50" x2="49" y2="82" stroke="#64748b" stroke-width="2"/>
    <line x1="70" y1="50" x2="70" y2="82" stroke="#64748b" stroke-width="2"/>
    <line x1="93" y1="50" x2="89" y2="82" stroke="#64748b" stroke-width="2"/>
    <!-- Cart Cast Wheels -->
    <circle cx="48" cy="88" r="8" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="48" cy="88" r="3" fill="#0f172a"/>
    <circle cx="90" cy="88" r="8" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="90" cy="88" r="3" fill="#0f172a"/>
    <!-- Track Rails -->
    <line x1="20" y1="96" x2="120" y2="96" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- Miner Pickaxe Tool -->
  <g filter="url(#mc_shadow)" transform="rotate(-30 70 30)">
    <!-- Steel Pick Head -->
    <path d="M50 18 Q70 12, 90 22 Q70 16, 50 18 Z" fill="#94a3b8" stroke="#334155" stroke-width="1.5"/>
    <!-- Wooden Handle -->
    <rect x="68" y="16" width="5" height="42" rx="2" fill="url(#mc_gold)" stroke="#854d0e" stroke-width="1"/>
  </g>
</svg>
