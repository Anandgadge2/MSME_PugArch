<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <defs>
    <linearGradient id="ic_can" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#1d4ed8"/></linearGradient>
    <linearGradient id="ic_disc" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#475569"/><stop offset="100%" stop-color="#1e293b"/></linearGradient>
    <linearGradient id="ic_tape" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#d97706"/></linearGradient>
    <filter id="ic_shadow" x="-10%" y="-10%" width="130%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.18"/></filter>
  </defs>
  <!-- Abrasive Grinding / Cutting Disc -->
  <g filter="url(#ic_shadow)" transform="translate(45, 65)">
    <circle cx="0" cy="0" r="32" fill="url(#ic_disc)" stroke="#0f172a" stroke-width="2"/>
    <circle cx="0" cy="0" r="18" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
    <circle cx="0" cy="0" r="7" fill="#0f172a"/>
    <!-- Label ring -->
    <circle cx="0" cy="0" r="25" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="8 4"/>
  </g>
  <!-- Industrial Aerosol Lubricant Spray Can -->
  <g filter="url(#ic_shadow)">
    <!-- Can body -->
    <rect x="82" y="44" width="30" height="52" rx="4" fill="url(#ic_can)" stroke="#1e3a8a" stroke-width="1.5"/>
    <rect x="82" y="60" width="30" height="18" fill="#facc15"/>
    <!-- Nozzle & Cap -->
    <rect x="85" y="36" width="24" height="8" rx="2" fill="#0f172a"/>
    <rect x="94" y="28" width="6" height="8" fill="#ef4444"/>
    <!-- Spray Straw -->
    <line x1="100" y1="32" x2="122" y2="28" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- Industrial Duct Tape Roll -->
  <g filter="url(#ic_shadow)" transform="translate(48, 92)">
    <ellipse cx="0" cy="0" rx="22" ry="12" fill="url(#ic_tape)" stroke="#b45309" stroke-width="1.5"/>
    <ellipse cx="0" cy="0" rx="10" ry="5.5" fill="#f8fafc" stroke="#b45309" stroke-width="1"/>
  </g>
</svg>
