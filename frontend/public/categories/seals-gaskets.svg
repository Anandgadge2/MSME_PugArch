<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <defs>
    <linearGradient id="sg_metal" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#94a3b8"/></linearGradient>
    <linearGradient id="sg_rubber" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#475569"/><stop offset="100%" stop-color="#0f172a"/></linearGradient>
    <filter id="sg_shadow" x="-10%" y="-10%" width="130%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.18"/></filter>
  </defs>
  <!-- Large Spiral Wound Flange Metallic Gasket -->
  <g filter="url(#sg_shadow)" transform="translate(56, 68)">
    <!-- Outer Centering Ring with Bolt Holes -->
    <circle cx="0" cy="0" r="38" fill="url(#sg_metal)" stroke="#334155" stroke-width="1.5"/>
    <!-- Bolt Holes -->
    <circle cx="0" cy="-30" r="4" fill="#ffffff" stroke="#475569" stroke-width="1"/>
    <circle cx="30" cy="0" r="4" fill="#ffffff" stroke="#475569" stroke-width="1"/>
    <circle cx="0" cy="30" r="4" fill="#ffffff" stroke="#475569" stroke-width="1"/>
    <circle cx="-30" cy="0" r="4" fill="#ffffff" stroke="#475569" stroke-width="1"/>
    <!-- Spiral Sealing Element Ring -->
    <circle cx="0" cy="0" r="22" fill="#0284c7" stroke="#0369a1" stroke-width="1"/>
    <circle cx="0" cy="0" r="19" fill="#facc15"/>
    <circle cx="0" cy="0" r="16" fill="#0284c7"/>
    <!-- Inner Ring -->
    <circle cx="0" cy="0" r="13" fill="url(#sg_metal)" stroke="#334155" stroke-width="1"/>
    <circle cx="0" cy="0" r="10" fill="#ffffff"/>
  </g>
  <!-- Rubber O-Rings and Oil Shaft Seal -->
  <g filter="url(#sg_shadow)" transform="translate(96, 52)">
    <circle cx="0" cy="0" r="18" fill="none" stroke="url(#sg_rubber)" stroke-width="6"/>
  </g>
  <g filter="url(#sg_shadow)" transform="translate(100, 88)">
    <circle cx="0" cy="0" r="14" fill="none" stroke="#ea580c" stroke-width="4.5"/>
  </g>
</svg>
