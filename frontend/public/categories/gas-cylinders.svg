<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <defs>
    <linearGradient id="gc_red" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ef4444"/><stop offset="100%" stop-color="#b91c1c"/></linearGradient>
    <linearGradient id="gc_blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0ea5e9"/><stop offset="100%" stop-color="#0369a1"/></linearGradient>
    <linearGradient id="gc_brass" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fef08a"/><stop offset="100%" stop-color="#ca8a04"/></linearGradient>
    <filter id="gc_shadow" x="-10%" y="-10%" width="130%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.18"/></filter>
  </defs>
  <!-- Tall Industrial Gas Cylinder (Oxygen / Nitrogen) -->
  <g filter="url(#gc_shadow)">
    <!-- Cylinder Body -->
    <path d="M30 42 C30 30, 56 30, 56 42 L56 94 A 4 4 0 0 1 52 98 L34 98 A 4 4 0 0 1 30 94 Z" fill="url(#gc_blue)" stroke="#075985" stroke-width="1.5"/>
    <rect x="30" y="52" width="26" height="12" fill="#ffffff" opacity="0.8"/>
    <!-- Brass Valve on Top -->
    <rect x="40" y="24" width="6" height="8" rx="1" fill="url(#gc_brass)"/>
    <rect x="36" y="20" width="14" height="4" rx="1" fill="#334155"/>
  </g>
  <!-- Short LPG / Industrial Gas Cylinder -->
  <g filter="url(#gc_shadow)">
    <!-- Protective collar guard -->
    <rect x="68" y="36" width="36" height="10" rx="3" fill="#991b1b" stroke="#7f1d1d" stroke-width="1"/>
    <circle cx="86" cy="41" r="3" fill="#ffffff"/>
    <!-- Dome Top & Cylinder Body -->
    <path d="M64 54 C64 42, 108 42, 108 54 L108 90 C108 96, 64 96, 64 90 Z" fill="url(#gc_red)" stroke="#7f1d1d" stroke-width="1.5"/>
    <!-- Foot ring base -->
    <rect x="70" y="94" width="32" height="6" rx="2" fill="#7f1d1d"/>
  </g>
  <!-- Dual Pressure Gauge Manifold Regulator -->
  <g filter="url(#gc_shadow)" transform="translate(100, 26)">
    <circle cx="12" cy="12" r="10" fill="#ffffff" stroke="url(#gc_brass)" stroke-width="2"/>
    <line x1="12" y1="12" x2="16" y2="7" stroke="#dc2626" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="12" cy="12" r="2" fill="#0f172a"/>
  </g>
</svg>
