<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <defs>
    <linearGradient id="im_teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#0f766e"/></linearGradient>
    <linearGradient id="im_board" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#e2e8f0"/></linearGradient>
    <linearGradient id="im_orange" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fb923c"/><stop offset="100%" stop-color="#ea580c"/></linearGradient>
    <filter id="im_shadow" x="-10%" y="-10%" width="130%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.18"/></filter>
  </defs>
  <!-- Maintenance Audit Checklist Clipboard -->
  <g filter="url(#im_shadow)">
    <rect x="22" y="32" width="56" height="74" rx="4" fill="url(#im_board)" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Clip on top -->
    <rect x="38" y="24" width="24" height="12" rx="2" fill="#334155"/>
    <circle cx="50" cy="30" r="3" fill="#cbd5e1"/>
    <!-- Checklist items with green checkmarks -->
    <rect x="30" y="44" width="8" height="8" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <path d="M32 48 L34 50 L37 45" stroke="#16a34a" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <line x1="43" y1="48" x2="68" y2="48" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>

    <rect x="30" y="58" width="8" height="8" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <path d="M32 62 L34 64 L37 59" stroke="#16a34a" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <line x1="43" y1="62" x2="68" y2="62" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>

    <rect x="30" y="72" width="8" height="8" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <path d="M32 76 L34 78 L37 73" stroke="#16a34a" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <line x1="43" y1="76" x2="68" y2="76" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>

    <rect x="30" y="86" width="8" height="8" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
    <line x1="43" y1="90" x2="62" y2="90" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- Crossed Heavy Pipe Wrench & Screwdriver Tool Badge -->
  <g filter="url(#im_shadow)" transform="translate(86, 68)">
    <circle cx="0" cy="0" r="26" fill="url(#im_teal)" stroke="#115e59" stroke-width="1.5"/>
    <!-- Crossed Wrench & Screwdriver -->
    <path d="M-14 -14 L14 14" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <path d="M14 -14 L-14 14" stroke="url(#im_orange)" stroke-width="4" stroke-linecap="round"/>
    <!-- Gear Ring overlay -->
    <circle cx="0" cy="0" r="14" fill="none" stroke="#f0fdfa" stroke-width="2.5" stroke-dasharray="4 3"/>
    <circle cx="0" cy="0" r="5" fill="#134e4a"/>
  </g>
</svg>
