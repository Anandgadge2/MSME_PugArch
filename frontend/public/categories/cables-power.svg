<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <defs>
    <linearGradient id="cp_sheath" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1e293b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient>
    <linearGradient id="cp_copper" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f59e0b"/><stop offset="50%" stop-color="#ea580c"/><stop offset="100%" stop-color="#b45309"/></linearGradient>
    <linearGradient id="cp_trans" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0284c7"/><stop offset="100%" stop-color="#0369a1"/></linearGradient>
    <filter id="cp_shadow" x="-10%" y="-10%" width="130%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.18"/></filter>
  </defs>
  <!-- Electrical Power Transformer / Switchgear in Background -->
  <g filter="url(#cp_shadow)">
    <rect x="75" y="42" width="46" height="50" rx="4" fill="url(#cp_trans)" stroke="#075985" stroke-width="1.5"/>
    <rect x="80" y="50" width="36" height="12" rx="2" fill="#0f172a"/>
    <circle cx="88" cy="56" r="3" fill="#22c55e"/>
    <circle cx="98" cy="56" r="3" fill="#eab308"/>
    <circle cx="108" cy="56" r="3" fill="#ef4444"/>
    <!-- Insulator Bushings on Top -->
    <rect x="84" y="32" width="8" height="10" rx="2" fill="#94a3b8" stroke="#475569" stroke-width="1"/>
    <rect x="104" y="32" width="8" height="10" rx="2" fill="#94a3b8" stroke="#475569" stroke-width="1"/>
  </g>
  <!-- Multi-Core Armored Power Cable Cutaway -->
  <g filter="url(#cp_shadow)">
    <!-- Outer Sheath -->
    <path d="M15 88 C30 84, 45 78, 62 62" fill="none" stroke="url(#cp_sheath)" stroke-width="18" stroke-linecap="round"/>
    <!-- Core 1 (Red Phase) -->
    <path d="M48 68 L64 54" stroke="#ef4444" stroke-width="5" stroke-linecap="round"/>
    <line x1="64" y1="54" x2="72" y2="47" stroke="url(#cp_copper)" stroke-width="3" stroke-linecap="round"/>
    <!-- Core 2 (Yellow Phase) -->
    <path d="M54 75 L72 63" stroke="#eab308" stroke-width="5" stroke-linecap="round"/>
    <line x1="72" y1="63" x2="80" y2="58" stroke="url(#cp_copper)" stroke-width="3" stroke-linecap="round"/>
    <!-- Core 3 (Blue Phase) -->
    <path d="M58 83 L76 75" stroke="#3b82f6" stroke-width="5" stroke-linecap="round"/>
    <line x1="76" y1="75" x2="85" y2="72" stroke="url(#cp_copper)" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- High Voltage Flash Badge -->
  <g transform="translate(20, 25)">
    <polygon points="14,2 4,14 11,14 8,24 18,10 11,10" fill="#f59e0b" stroke="#b45309" stroke-width="1"/>
  </g>
</svg>
