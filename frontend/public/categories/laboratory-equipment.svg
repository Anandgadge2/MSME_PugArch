<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <defs>
    <linearGradient id="le_scope" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#94a3b8"/></linearGradient>
    <linearGradient id="le_flask" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#0284c7"/></linearGradient>
    <linearGradient id="le_tube" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#34d399"/><stop offset="100%" stop-color="#059669"/></linearGradient>
    <filter id="le_shadow" x="-10%" y="-10%" width="130%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.18"/></filter>
  </defs>
  <!-- Laboratory Microscope -->
  <g filter="url(#le_shadow)">
    <!-- Base -->
    <path d="M25 96 L65 96 C65 96, 65 90, 55 90 L35 90 Z" fill="#334155" stroke="#1e293b" stroke-width="1.5"/>
    <!-- Arm curved -->
    <path d="M36 90 C36 60, 48 40, 58 40" fill="none" stroke="url(#le_scope)" stroke-width="8" stroke-linecap="round"/>
    <!-- Stage plate -->
    <rect x="42" y="68" width="26" height="5" rx="1" fill="#1e293b"/>
    <!-- Eyepiece Tube -->
    <rect x="52" y="24" width="8" height="20" rx="2" fill="url(#le_scope)" stroke="#475569" stroke-width="1" transform="rotate(20 56 34)"/>
    <rect x="56" y="18" width="12" height="6" rx="2" fill="#0f172a" transform="rotate(20 56 34)"/>
    <!-- Objective Turret & Lens -->
    <circle cx="56" cy="54" r="6" fill="#0f172a"/>
    <rect x="54" y="58" width="5" height="8" rx="1" fill="#f59e0b"/>
  </g>
  <!-- Erlenmeyer Volumetric Flask with Reagent -->
  <g filter="url(#le_shadow)">
    <path d="M85 55 L91 55 L91 65 L108 92 A 6 6 0 0 1 103 98 L73 98 A 6 6 0 0 1 68 92 L85 65 Z" fill="#f1f5f9" stroke="#0284c7" stroke-width="1.5"/>
    <!-- Liquid in Flask -->
    <path d="M72 90 L104 90 A 6 6 0 0 1 103 98 L73 98 A 6 6 0 0 1 72 90 Z" fill="url(#le_flask)"/>
    <!-- Bubbles -->
    <circle cx="85" cy="85" r="2.5" fill="#e0f2fe"/>
    <circle cx="94" cy="82" r="1.5" fill="#e0f2fe"/>
  </g>
  <!-- Test Tube in Rack -->
  <g filter="url(#le_shadow)">
    <rect x="108" y="46" width="10" height="46" rx="5" fill="#f8fafc" stroke="#059669" stroke-width="1.5"/>
    <rect x="110" y="66" width="6" height="24" rx="3" fill="url(#le_tube)"/>
  </g>
</svg>
