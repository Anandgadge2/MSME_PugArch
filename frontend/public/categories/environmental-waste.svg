<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <defs>
    <linearGradient id="ew_green" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#22c55e"/><stop offset="100%" stop-color="#15803d"/></linearGradient>
    <linearGradient id="ew_bin" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#1d4ed8"/></linearGradient>
    <filter id="ew_shadow" x="-10%" y="-10%" width="130%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.18"/></filter>
  </defs>
  <!-- Circular Recycling Chasing Arrows Badge -->
  <g filter="url(#ew_shadow)" transform="translate(48, 62)">
    <circle cx="0" cy="0" r="30" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <!-- Recycling 3 arrow loop -->
    <path d="M-12 -14 L6 -18 L12 -6" fill="none" stroke="#15803d" stroke-width="3" stroke-linecap="round"/>
    <polygon points="6,-24 16,-18 7,-12" fill="#15803d"/>
    <path d="M14 -4 L16 14 L4 18" fill="none" stroke="#15803d" stroke-width="3" stroke-linecap="round"/>
    <polygon points="22,12 16,22 10,14" fill="#15803d"/>
    <path d="M-2 16 L-16 8 L-14 -8" fill="none" stroke="#15803d" stroke-width="3" stroke-linecap="round"/>
    <polygon points="-22,10 -18,-2 -10,6" fill="#15803d"/>
    <!-- Eco Leaf Center -->
    <path d="M0 4 C-8 0, -8 -10, 0 -12 C8 -10, 8 0, 0 4 Z" fill="url(#ew_green)"/>
  </g>
  <!-- Industrial Eco Receptacle Bin -->
  <g filter="url(#ew_shadow)">
    <!-- Bin lid -->
    <rect x="80" y="44" width="36" height="8" rx="3" fill="#1e293b"/>
    <rect x="92" y="38" width="12" height="6" rx="2" fill="#334155"/>
    <!-- Bin body -->
    <polygon points="84,52 112,52 108,94 88,94" fill="url(#ew_bin)" stroke="#1e3a8a" stroke-width="1.5"/>
    <line x1="96" y1="58" x2="96" y2="88" stroke="#93c5fd" stroke-width="2" stroke-linecap="round"/>
    <!-- Wheels -->
    <circle cx="86" cy="94" r="5" fill="#1e293b"/>
    <circle cx="110" cy="94" r="5" fill="#1e293b"/>
  </g>
</svg>
