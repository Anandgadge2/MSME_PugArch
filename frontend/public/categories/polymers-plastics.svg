<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <defs>
    <linearGradient id="pl_blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#0891b2"/></linearGradient>
    <linearGradient id="pl_pipe" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#0284c7"/></linearGradient>
    <filter id="pl_shadow" x="-10%" y="-10%" width="130%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.18"/></filter>
  </defs>
  <!-- Industrial HDPE Plastic Drum -->
  <g filter="url(#pl_shadow)">
    <rect x="25" y="44" width="48" height="56" rx="8" fill="url(#pl_blue)" stroke="#0e7490" stroke-width="1.5"/>
    <line x1="25" y1="58" x2="73" y2="58" stroke="#67e8f9" stroke-width="2"/>
    <line x1="25" y1="84" x2="73" y2="84" stroke="#67e8f9" stroke-width="2"/>
    <!-- Drum Bungs / Caps -->
    <circle cx="38" cy="44" r="5" fill="#f8fafc" stroke="#0e7490" stroke-width="1"/>
    <circle cx="60" cy="44" r="5" fill="#f8fafc" stroke="#0e7490" stroke-width="1"/>
  </g>
  <!-- Extruded Polymer Molded Fitting / Pipe Section -->
  <g filter="url(#pl_shadow)">
    <ellipse cx="98" cy="52" rx="18" ry="10" fill="url(#pl_pipe)" stroke="#0369a1" stroke-width="1.5"/>
    <ellipse cx="98" cy="52" rx="9" ry="5" fill="#f8fafc" stroke="#0369a1" stroke-width="1"/>
    <path d="M80 52 L80 82 A 18 10 0 0 0 116 82 L116 52 Z" fill="url(#pl_pipe)" stroke="#0369a1" stroke-width="1.5"/>
    <ellipse cx="98" cy="82" rx="18" ry="10" fill="#0284c7" stroke="#0369a1" stroke-width="1"/>
  </g>
  <!-- Polymer Resin Pellets / Granules -->
  <g>
    <circle cx="82" cy="98" r="4.5" fill="#f59e0b"/>
    <circle cx="94" cy="100" r="5" fill="#10b981"/>
    <circle cx="106" cy="97" r="4.5" fill="#ef4444"/>
    <circle cx="88" cy="106" r="4.5" fill="#8b5cf6"/>
    <circle cx="100" cy="106" r="4" fill="#06b6d4"/>
  </g>
</svg>
