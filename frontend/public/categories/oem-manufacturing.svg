<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <defs>
    <linearGradient id="oem_blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1d4ed8"/><stop offset="100%" stop-color="#1e3a8a"/></linearGradient>
    <linearGradient id="oem_metal" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#94a3b8"/></linearGradient>
    <linearGradient id="oem_gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fde047"/><stop offset="100%" stop-color="#ca8a04"/></linearGradient>
    <filter id="oem_shadow" x="-10%" y="-10%" width="130%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.18"/></filter>
  </defs>
  <!-- Industrial CNC Milling Machine Head / Spindle -->
  <g filter="url(#oem_shadow)">
    <!-- Spindle Housing -->
    <rect x="52" y="24" width="36" height="32" rx="4" fill="url(#oem_blue)" stroke="#1e3a8a" stroke-width="1.5"/>
    <rect x="60" y="56" width="20" height="14" rx="2" fill="url(#oem_metal)" stroke="#475569" stroke-width="1"/>
    <!-- Precision Milling End Mill Bit -->
    <polygon points="66,70 74,70 72,84 68,84" fill="#334155"/>
    <!-- Laser Alignment Guide -->
    <line x1="70" y1="84" x2="70" y2="98" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="2 2"/>
  </g>
  <!-- Precision Machined OEM Component / Turbine Blade on Chuck Table -->
  <g filter="url(#oem_shadow)">
    <rect x="25" y="94" width="90" height="12" rx="3" fill="#334155" stroke="#1e293b" stroke-width="1.5"/>
    <!-- Machined Metal Part -->
    <path d="M42 94 L50 82 L90 82 L98 94 Z" fill="url(#oem_gold)" stroke="#854d0e" stroke-width="1"/>
    <circle cx="70" cy="88" r="4" fill="#1e293b"/>
  </g>
  <!-- OEM Certified Stamp / Quality Ribbon -->
  <g filter="url(#oem_shadow)" transform="translate(18, 30)">
    <circle cx="16" cy="16" r="14" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
    <text x="16" y="19" font-family="sans-serif" font-size="7" font-weight="900" fill="#1d4ed8" text-anchor="middle">OEM</text>
  </g>
</svg>
