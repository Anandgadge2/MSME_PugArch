<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <radialGradient id="logoBgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="85%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </radialGradient>
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="300" height="300" rx="40" fill="url(#logoBgGrad)" />
  <rect width="300" height="300" rx="40" fill="none" stroke="#e2e8f0" stroke-width="2" opacity="0.8" />

  <g filter="url(#logoShadow)">
    <g transform="translate(150, 105)">
      <!-- Iconic Vedanta Globe Ribbon -->
      <circle cx="0" cy="0" r="54" fill="none" stroke="#002b49" stroke-width="12" />
      <!-- Vibrant Green Arc Ribbon -->
      <path d="M-42 -10 C-38 38 18 48 48 14 C28 38 -14 34 -32 -5 Z" fill="#00a651" />
      <!-- Inner Dynamic V Core -->
      <path d="M-26 -26 L0 24 L26 -26" fill="none" stroke="#002b49" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <!-- Brand Typography -->
    <text x="150" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#002b49" text-anchor="middle" letter-spacing="-0.5">vedanta</text>
    <text x="150" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#00a651" text-anchor="middle" letter-spacing="3">TRANSFORMING ELEMENTS</text>
    <text x="150" y="242" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" fill="#64748b" text-anchor="middle" letter-spacing="1.5">JHARSUGUDA</text>
  </g>
</svg>