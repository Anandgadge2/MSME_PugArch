<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <radialGradient id="logoBgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="85%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </radialGradient>
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="300" height="300" rx="40" fill="url(#logoBgGrad)" />
  <rect width="300" height="300" rx="40" fill="none" stroke="#e2e8f0" stroke-width="2" opacity="0.8" />

  <g filter="url(#logoShadow)">
    <g transform="translate(150, 80)">
      <circle cx="0" cy="0" r="28" fill="#eab308" />
      <g fill="#dc2626">
        <polygon points="0,-48 8,-35 -8,-35" />
        <polygon points="34,-34 32,-18 20,-28" />
        <polygon points="48,0 35,8 35,-8" />
        <polygon points="34,34 20,28 32,18" />
        <polygon points="0,48 -8,35 8,35" />
        <polygon points="-34,34 -32,18 -20,28" />
        <polygon points="-48,0 -35,-8 -35,8" />
        <polygon points="-34,-34 -20,-28 -32,-18" />
      </g>
      <circle cx="0" cy="0" r="18" fill="#fde047" />
    </g>
    <rect x="35" y="145" width="230" height="42" rx="8" fill="#facc15" stroke="#eab308" stroke-width="2" />
    <text x="150" y="174" font-family="'Arial Black', Impact, sans-serif" font-size="22" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="1">UltraTech</text>
    <text x="150" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#dc2626" text-anchor="middle" letter-spacing="4">CEMENT</text>
    <text x="150" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" fill="#475569" text-anchor="middle" letter-spacing="1.5">JHARSUGUDA CEMENT WORKS</text>
  </g>
</svg>