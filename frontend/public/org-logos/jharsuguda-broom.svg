<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <radialGradient id="logoBgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="85%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </radialGradient>
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="300" height="300" rx="40" fill="url(#logoBgGrad)" />
  <rect width="300" height="300" rx="40" fill="none" stroke="#e2e8f0" stroke-width="2" opacity="0.8" />

  <g filter="url(#logoShadow)">
    <g transform="translate(150, 95)">
      <circle cx="0" cy="0" r="52" fill="#15803d" stroke="#166534" stroke-width="4" />
      <path d="M0 -35 L12 -35 L20 30 L-20 30 L-12 -35 Z" fill="#fde047" stroke="#ca8a04" stroke-width="2" />
      <rect x="-16" y="-10" width="32" height="12" rx="3" fill="#dc2626" />
      <rect x="-18" y="10" width="36" height="12" rx="3" fill="#dc2626" />
    </g>
    <text x="150" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="1">JHARSUGUDA</text>
    <text x="150" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" fill="#15803d" text-anchor="middle" letter-spacing="2">BROOM</text>
    <text x="150" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#64748b" text-anchor="middle">NATURAL HILL GRASS &amp; COIR</text>
  </g>
