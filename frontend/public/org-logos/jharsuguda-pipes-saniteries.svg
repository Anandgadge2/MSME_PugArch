<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <radialGradient id="logoBgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="85%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </radialGradient>
    <linearGradient id="chromeMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="40%" stop-color="#cbd5e1" />
      <stop offset="70%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="300" height="300" rx="40" fill="url(#logoBgGrad)" />
  <rect width="300" height="300" rx="40" fill="none" stroke="#e2e8f0" stroke-width="2" opacity="0.8" />

  <g filter="url(#logoShadow)">
    <g transform="translate(150, 95)">
      <circle cx="0" cy="0" r="52" fill="#0891b2" stroke="#0e7490" stroke-width="4" />
      <rect x="-35" y="-12" width="70" height="24" rx="4" fill="url(#chromeMetal)" stroke="#1e293b" stroke-width="2" />
      <rect x="-12" y="-35" width="24" height="40" rx="4" fill="url(#chromeMetal)" stroke="#1e293b" stroke-width="2" />
      <circle cx="0" cy="0" r="6" fill="#0891b2" />
    </g>
    <text x="150" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="0.5">JHARSUGUDA PIPES</text>
    <text x="150" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" fill="#0891b2" text-anchor="middle" letter-spacing="2">'N' SANITERIES</text>
    <text x="150" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#64748b" text-anchor="middle">VALVES, FITTINGS &amp; PIPES</text>
  </g>
</svg>