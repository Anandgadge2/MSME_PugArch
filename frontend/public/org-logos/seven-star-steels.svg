<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <radialGradient id="logoBgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="85%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="300" height="300" rx="40" fill="url(#logoBgGrad)" />
  <rect width="300" height="300" rx="40" fill="none" stroke="#e2e8f0" stroke-width="2" opacity="0.8" />

  <g filter="url(#logoShadow)">
    <g transform="translate(150, 92)">
      <!-- Steel Blue Diamond -->
      <polygon points="0,-50 50,0 0,50 -50,0" fill="#0f172a" stroke="#38bdf8" stroke-width="3" />
      <!-- Big Golden Star Center -->
      <polygon points="0,-25 8,-8 25,-8 12,3 17,20 0,10 -17,20 -12,3 -25,-8 -8,-8" fill="url(#goldGrad)" />
      <!-- Outer Stars Arc -->
      <g fill="#fde047">
        <circle cx="-35" cy="-25" r="4" />
        <circle cx="-42" cy="0" r="4" />
        <circle cx="-35" cy="25" r="4" />
        <circle cx="35" cy="-25" r="4" />
        <circle cx="42" cy="0" r="4" />
        <circle cx="35" cy="25" r="4" />
      </g>
    </g>
    <text x="150" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="1">SEVEN STAR</text>
    <text x="150" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" fill="#0284c7" text-anchor="middle" letter-spacing="3">STEELS LIMITED</text>
    <text x="150" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#64748b" text-anchor="middle">JHARSUGUDA</text>
  </g>
</svg>