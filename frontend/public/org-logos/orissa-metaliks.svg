<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <radialGradient id="logoBgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="85%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="300" height="300" rx="40" fill="url(#logoBgGrad)" />
  <rect width="300" height="300" rx="40" fill="none" stroke="#e2e8f0" stroke-width="2" opacity="0.8" />

  <g filter="url(#logoShadow)">
    <g transform="translate(150, 95)">
      <!-- Steel Ladle / Ingot Emblem -->
      <circle cx="0" cy="0" r="54" fill="#7f1d1d" stroke="#991b1b" stroke-width="4" />
      <polygon points="-30,-15 30,-15 20,25 -20,25" fill="url(#goldGrad)" />
      <circle cx="0" cy="-22" r="14" fill="#fef08a" />
    </g>
    <text x="150" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#7f1d1d" text-anchor="middle" letter-spacing="1">ORISSA METALIKS</text>
    <text x="150" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#b45309" text-anchor="middle" letter-spacing="2.5">PRIVATE LIMITED</text>
    <text x="150" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#64748b" text-anchor="middle">INTEGRATED STEEL PLANT</text>
  </g>
</svg>